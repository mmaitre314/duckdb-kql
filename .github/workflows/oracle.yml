# The Kusto Emulator lane — ground truth, on demand and nightly.
#
# Deliberately NOT part of per-push CI. The image is ~1.2 GB and the emulator is
# x86-64 only, so making every PR wait on it would be slow and would break
# ARM development. Per-push CI compares against frozen expectations instead
# (ci.yml); this lane is what produces and re-validates them.
#
# Licensing (docs/licensing.md §5): the image is pulled from MCR, never
# redistributed, never exposed as a service, and never a runtime dependency of
# the shipped library. ACCEPT_EULA=Y records the owner's acceptance of the
# Microsoft Software License Terms reviewed in §5.4. Per §2(d) this workflow
# must never publish timing or performance numbers — it asserts correctness only.
name: Oracle (Kusto Emulator)

on:
  schedule:
    # 04:00 UTC daily — drift check against a fresh :latest pull.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: What to do with the emulator
        type: choice
        default: check
        options:
          - check        # verify frozen expectations, change nothing
          - regenerate   # re-freeze and upload the updated corpus
      image:
        description: Image ref (blank = the digest pinned in docker-compose.yml)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: oracle
  cancel-in-progress: false

jobs:
  oracle:
    # MUST be x86-64: the emulator requires SSE4.2/AVX2 and does not run on the
    # ARM runners. Do not "modernize" this to ubuntu-*-arm.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Scheduled runs deliberately pull :latest so a new Microsoft build shows
      # up as drift. Manual runs default to the pinned digest for reproducibility.
      KUSTO_IMAGE: >-
        ${{ inputs.image
            || (github.event_name == 'schedule'
                && 'mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest'
                || '') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Start the emulator
        run: |
          docker compose up -d kusto
          docker compose images kusto

      - name: Wait for readiness
        run: |
          # First start initialises storage and takes a couple of minutes.
          for i in $(seq 1 60); do
            if curl -fsS -m 5 -X POST http://localhost:8080/v1/rest/query \
                 -H 'Content-Type: application/json' \
                 -d '{"db":"NetDefaultDB","csl":"print 1"}' >/dev/null 2>&1; then
              echo "emulator ready after ${i} polls"
              exit 0
            fi
            sleep 10
          done
          echo "::error::emulator did not become ready"
          docker compose logs --tail 100 kusto
          exit 1

      - name: Record the exact image digest
        id: digest
        run: |
          d=$(docker inspect --format '{{index .RepoDigests 0}}' \
                "$(docker compose images -q kusto)")
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "Emulator image: $d"

      # Drift means the ground truth our entire acceptance suite is measured
      # against has moved. It is a finding to investigate, never something to
      # silently re-freeze.
      - name: Check for drift
        if: inputs.mode != 'regenerate'
        run: python tools/regen_expectations.py --check

      - name: Regenerate expectations
        if: inputs.mode == 'regenerate'
        run: |
          python tools/regen_expectations.py --image-digest "${{ steps.digest.outputs.digest }}"
          git diff --stat -- tests/cases

      # Uploaded rather than committed: a regenerated corpus changes the
      # yardstick for every test, so it goes through review like any other diff.
      - name: Upload the regenerated corpus
        if: inputs.mode == 'regenerate'
        uses: actions/upload-artifact@v4
        with:
          name: docs-corpus
          path: tests/cases/**
          retention-days: 14

      - name: Emulator logs on failure
        if: failure()
        run: docker compose logs --tail 200 kusto

      - name: Tear down
        if: always()
        run: docker compose down -v
