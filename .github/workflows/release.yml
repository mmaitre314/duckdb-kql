# Build the distributions, and publish them when a release is made.
#
# Nothing here publishes on a push. Building runs on every push and pull request
# so that a packaging break is caught with the commit that caused it rather than
# at release time — but the artifacts only leave this repository when a GitHub
# Release is published.
#
# Publishing uses PyPI Trusted Publishing (OIDC), so there is no API token in
# this repository to leak or rotate. Before the first release, register the
# publisher at https://pypi.org/manage/account/publishing/ with:
#
#     owner:       mmaitre314
#     repository:  duckdb-kql
#     workflow:    release.yml
#     environment: pypi
#
# The version comes from the git tag (hatch-vcs, see pyproject.toml). Publishing
# a GitHub Release for `v0.2.0` is the whole procedure — there is no file to bump
# and nothing that can disagree with the tag.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  # Manual runs build and check without publishing — the way to rehearse a
  # release, or to confirm a packaging change, without spending a version number.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from the git tag, so the tags have to
          # be here. The default shallow clone has none of them, and the failure
          # is silent: the build succeeds and publishes `0.1.dev1` instead of
          # `0.1.0`.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check the metadata renders
        run: python -m twine check --strict dist/*

      # The old job compared the tag against two files. There are no files left
      # to disagree, but one failure mode survives and it is silent: if the tags
      # are missing from the checkout, hatch-vcs falls back to a dev version and
      # the build happily publishes `0.1.dev1` as if it were `0.1.0`. On PyPI
      # that number is then spent forever.
      - name: The built version is the tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          from packaging.utils import parse_wheel_filename
          from packaging.version import Version

          tag = Version(os.environ["GITHUB_REF_NAME"].lstrip("v"))
          wheel = next(Path("dist").glob("*.whl"))
          # Compare parsed versions, not strings: `v1.0.0-rc1` and the `1.0.0rc1`
          # in the filename are the same version spelled two ways.
          built = parse_wheel_filename(wheel.name)[1]

          if built != tag:
              sys.exit(f"::error::tag says {tag}, built distribution is {built} "
                       "— the checkout is probably missing its tags")
          print(f"built {built} from tag {tag}")
          PY

      # The wheel is what almost everyone installs, so it is what gets smoke
      # tested — installed into a clean environment from the built artifact
      # rather than from the working tree, which is where packaging mistakes
      # (a missing subpackage, an unshipped data file) actually show up.
      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install "$(ls dist/*.whl)[all]"
          /tmp/wheeltest/bin/python - <<'PY'
          import duckdb_kql
          from duckdb_kql.kusto import KustoClient

          con = duckdb_kql.connect()
          con.sql("CREATE TABLE T AS SELECT 'x' AS s, 1 AS n")

          assert duckdb_kql.sql(con, "T | where s == 'x' | count").fetchall() == [(1,)]
          assert duckdb_kql.to_sql("print x = 1").startswith("SELECT")

          # A parameter must still be bound rather than spliced, from the wheel.
          kql = "declare query_parameters(p:string); T | where s == p | count"
          assert duckdb_kql.sql(con, kql, {"p": "' OR 1=1 --"}).fetchall() == [(0,)]

          with KustoClient(":memory:") as client:
              assert client.execute("db", "print n = 1").primary_results[0].raw_rows == [[1]]

          print("wheel", duckdb_kql.__version__, "OK")
          PY

      # The sdist has to be able to produce the wheel, or `pip install` from
      # source is broken for anyone without a matching wheel.
      - name: Build a wheel from the sdist
        run: |
          mkdir -p /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist
          python -m build --wheel --outdir /tmp/from-sdist /tmp/sdist/*/

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    # Only a published GitHub Release publishes. A tag push builds and checks
    # but does not upload, so tagging is recoverable and releasing is deliberate.
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/duckdb-kql
    permissions:
      id-token: write # OIDC, in place of an API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  attach-to-release:
    name: Attach distributions to the release
    needs: publish-to-pypi
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --repo "${{ github.repository }}"
