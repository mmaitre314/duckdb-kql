# Per-push CI — hermetic. No Docker, no emulator, no network.
#
# Everything here runs against expectations already frozen into the corpus, so
# this lane stays fast and works on any architecture (including Apple Silicon,
# which the emulator does not support). The emulator lives in oracle.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Floor and ceiling of the supported range (pyproject requires-python
        # and the classifiers). tests/test_workflows.py asserts both are here:
        # claiming a version nothing runs is how a version-specific failure
        # reaches main.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tools tests demo

      # The package ships py.typed, which is a promise that its annotations are
      # worth trusting. tests/test_typing.py checks what a *caller* sees; this
      # checks the inside.
      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest -q

  # Layer 0 is documented as translating KQL with nothing but the ANTLR runtime
  # installed. The test suite cannot check that — it runs with everything
  # present — so the claim is verified the only way it can be: by installing the
  # package alone and using it with duckdb genuinely absent.
  layer-0-installs-without-duckdb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the package with no extras
        run: python -m pip install .

      - name: Fail if anything but the ANTLR runtime came along
        run: |
          python - <<'PY'
          import importlib.util, sys

          for forbidden in ("duckdb", "pandas", "pyarrow"):
              if importlib.util.find_spec(forbidden) is not None:
                  sys.exit(f"::error::a bare install pulled in {forbidden}")

          import duckdb_kql
          sql = duckdb_kql.to_sql('Logs | where Level == "Error" | take 10')
          assert "SELECT" in sql, sql
          assert duckdb_kql.parse("print 1").ok
          assert duckdb_kql.validate("print 1") == []

          # ... and that the layer above still fails with a usable message.
          try:
              duckdb_kql.connect()
          except ImportError as exc:
              assert "duckdb-kql[duckdb]" in str(exc), exc
          else:
              sys.exit("::error::connect() worked without duckdb installed")

          print("Layer 0 works on antlr4 alone")
          PY

      # The build-time CLI exists so users can translate in a minimal image and
      # ship SQL with no dependency on this package. That only holds if the
      # command itself runs in one.
      - name: The CLI works with duckdb absent
        run: |
          mkdir -p /tmp/q
          printf 'StormEvents | where State == "TEXAS" | count\n' > /tmp/q/count.kql
          duckdb-kql translate /tmp/q -o /tmp/sql/
          grep -q "SET TimeZone='UTC'" /tmp/sql/count.sql
          duckdb-kql translate /tmp/q -o /tmp/sql/ --check
          printf '| take 5\n' >> /tmp/q/count.kql
          if duckdb-kql translate /tmp/q -o /tmp/sql/ --check; then
            echo "::error::--check passed on a stale file"; exit 1
          fi
          echo "CLI works on antlr4 alone, and --check catches drift"

  # The generated parser is committed (see grammar/UPSTREAM.md) so that installs
  # need no Java. That only stays honest if the checked-in code still matches
  # the grammar it claims to come from.
  parser-is-in-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Regenerate the parser
        run: ./tools/regen_parser.sh

      - name: Fail if the committed parser differs from the grammar
        run: |
          if ! git diff --quiet -- src/duckdb_kql/_antlr; then
            echo "::error::Committed parser is stale. Run tools/regen_parser.sh and commit."
            git diff --stat -- src/duckdb_kql/_antlr
            exit 1
          fi
          echo "Committed parser matches grammar/Kql.g4"
