[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duckdb-kql"
version = "0.0.1.dev0"
description = "Run Kusto KQL queries on DuckDB, from Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Matthieu Maitre" }]
keywords = ["kql", "kusto", "duckdb", "sql", "analytics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

# Layer 0 — turning KQL text into DuckDB SQL — needs only the parser runtime.
# Everything else is an extra, so a caller who only translates does not install
# a database. The ANTLR runtime version must match the tool version used by
# tools/regen_parser.sh — see grammar/UPSTREAM.md.
dependencies = [
    "antlr4-python3-runtime==4.13.2",
]

[project.optional-dependencies]
# Layer 1 — running the translated SQL.
duckdb = ["duckdb>=0.10"]
# Layer 2 — the azure-kusto-data-shaped client. dataframe_from_result_table is
# the reason pandas is here; the client itself works without it.
kusto = ["duckdb-kql[duckdb]", "pandas"]
pandas = ["pandas"]
arrow = ["pyarrow"]
all = ["duckdb-kql[duckdb,pandas,arrow]"]
dev = [
    "duckdb-kql[all]",
    "pytest>=7",
    "ruff",
    # tests/test_docs.py reads pyproject.toml; tomllib arrived in 3.11.
    "tomli; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/mmaitre314/duckdb-kql"
Issues = "https://github.com/mmaitre314/duckdb-kql/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/duckdb_kql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
# Generated parser code is vendored verbatim — never lint or reformat it.
extend-exclude = ["src/duckdb_kql/_antlr"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
