[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "duckdb-kql"
# The git tag IS the version. Publishing a GitHub Release for `v0.2.0` produces
# 0.2.0 on PyPI with no file to edit and nothing to keep in sync — the class of
# mistake where the tag says one thing and the package says another simply
# cannot be made. See CONTRIBUTING.md "Releasing".
dynamic = ["version"]
description = "Run Kusto KQL queries on DuckDB, from Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Matthieu Maitre" }]
keywords = [
    "kql", "kusto", "duckdb", "sql", "analytics", "transpiler",
    "azure-data-explorer", "azure-monitor", "log-analytics", "query",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Compilers",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Layer 0 — turning KQL text into DuckDB SQL — needs only the parser runtime.
# Everything else is an extra, so a caller who only translates does not install
# a database. The ANTLR runtime version must match the tool version used by
# tools/regen_parser.sh — see grammar/UPSTREAM.md.
dependencies = [
    "antlr4-python3-runtime==4.13.2",
]

[project.optional-dependencies]
# Layer 1 — running the translated SQL.
duckdb = ["duckdb>=0.10"]
# Layer 2 — the azure-kusto-data-shaped client. dataframe_from_result_table is
# the reason pandas is here; the client itself works without it.
kusto = ["duckdb-kql[duckdb]", "pandas"]
pandas = ["pandas"]
arrow = ["pyarrow"]
all = ["duckdb-kql[duckdb,pandas,arrow]"]
dev = [
    "duckdb-kql[all]",
    "pytest>=7",
    "ruff",
    "mypy>=1.11",
    # pandas ships no py.typed, so without these `df()` resolves to Any and the
    # consumer-view test in tests/test_typing.py cannot tell the difference.
    "pandas-stubs",
    # tests/test_docs.py reads pyproject.toml; tomllib arrived in 3.11.
    "tomli; python_version < '3.11'",
    # tests/test_workflows.py reads the GitHub Actions definitions.
    "pyyaml",
    "types-PyYAML",
]

# Translating at build time means the *output* has no dependency on this
# package — see docs/cli.md.
[project.scripts]
duckdb-kql = "duckdb_kql.cli:main"

[project.urls]
Homepage = "https://github.com/mmaitre314/duckdb-kql"
Documentation = "https://github.com/mmaitre314/duckdb-kql/blob/main/docs/getting-started.md"
Source = "https://github.com/mmaitre314/duckdb-kql"
Changelog = "https://github.com/mmaitre314/duckdb-kql/releases"
Issues = "https://github.com/mmaitre314/duckdb-kql/issues"
"KQL support matrix" = "https://github.com/mmaitre314/duckdb-kql/blob/main/docs/kql-support.md"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Without this an untagged build gets a PEP 440 *local* version (`+g1a2b3c`),
# which every index rejects on upload — so the TestPyPI dry run would fail on a
# commit that has no tag, which is exactly when you want to dry-run. Dropping
# the local segment leaves `0.2.0.dev4`, which uploads fine.
local_scheme = "no-local-version"

# Written at build time so the installed package can report its own version
# without paying an importlib.metadata lookup on import. Generated, so it is
# gitignored — never edit or commit it.
[tool.hatch.build.hooks.vcs]
version-file = "src/duckdb_kql/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/duckdb_kql"]

# The sdist ships what someone needs to build, read and test the package. The
# frozen oracle corpus and its fixtures are deliberately left out: together they
# are ~29 MB of CI input that no installing user reads, and the acceptance suite
# already skips itself when they are absent. Everything needed to reproduce them
# is in the repository.
[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/.devcontainer",
    "/.github",
    "/docker-compose.yml",
    "/tests/cases",
    "/tests/fixtures",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
# Generated parser code is vendored verbatim — never lint or reformat it.
extend-exclude = ["src/duckdb_kql/_antlr", "src/duckdb_kql/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src/duckdb_kql"]
# The whole hand-written package clears this bar. It was reached module by
# module, but there is no reason to keep the ladder now that everything is at
# the top of it: a per-module allowance is an invitation to add one more.
#
# It is `strict` minus `disallow_any_explicit`: some values here are honestly
# Any. A `dynamic` column, a query-parameter value, an ANTLR tree node — naming
# a type for those would claim knowledge the code does not have. They are
# declared Any and commented, rather than inferred Any and unremarked.
#
# There is deliberately **no `python_version`**. Pinning it to the floor (3.10)
# looks right — one run would prove the source works there — but it also makes
# mypy parse every third-party stub with 3.10's grammar, and modern stubs use
# PEP 695 `type` statements, which are 3.12+. numpy 2.5 broke CI exactly this
# way, and the next dependency to adopt the syntax would do it again. Letting
# each interpreter check against itself is more robust *and* better coverage:
# CI runs the floor and the ceiling, so 3.10-incompatible code fails on the
# 3.10 lane while the newest semantics are exercised on the 3.13 one.
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
extra_checks = true
no_implicit_optional = true
no_implicit_reexport = false
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

# `_version.py` is generated by hatch-vcs at build time, so it is absent from a
# fresh checkout and is regenerated (never edited) on every build.
[[tool.mypy.overrides]]
module = "duckdb_kql._version"
ignore_errors = true
ignore_missing_imports = true

# The parser is generated by ANTLR and vendored verbatim (grammar/UPSTREAM.md).
# It is regenerated, never edited, so annotating it would be undone on the next
# `tools/regen_parser.sh`.
[[tool.mypy.overrides]]
module = "duckdb_kql._antlr.*"
ignore_errors = true
follow_imports = "skip"

# The ANTLR *runtime* ships no type information either, so every tree node is
# Any no matter what we do. That is confined to the parser boundary.
[[tool.mypy.overrides]]
# `azure.kusto.data` is optional and only touched inside a guarded import
# (see _models._register_with_sdk); it is never a dependency.
module = ["antlr4.*", "pyarrow.*", "azure.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# The support matrix is a data table of one-line prose notes. Wrapping them to
# 100 columns splits sentences across lines and makes the table harder to read
# and to diff, which is the opposite of what the limit is for.
"tools/gen_support_matrix.py" = ["E501"]
